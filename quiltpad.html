<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QuiltPad">
<title>QuiltPad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --sw:148px;--sw2:60px;--r:10px;
  --bg:#f4f3f1;--bg2:#eae8e5;--bg3:#dfddd9;--border:#d0cec9;
  --text:#2a2a2c;--text2:#8a888c;
  --accent:#7c5cbf;--accent2:#6a4baa;
  --canvas-bg:#ffffff;
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);touch-action:none;position:fixed;top:0;left:0;color:var(--text)}
.app{display:flex;width:100%;height:100%}

/* ── PRIMARY SIDEBAR ── */
.sidebar{width:var(--sw);min-width:var(--sw);height:100%;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px;z-index:10}
.sb-btn{width:128px;height:54px;border-radius:var(--r);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font);font-size:13px;font-weight:500;flex-shrink:0}
.sb-btn:active{transform:scale(0.96)}
.sb-btn svg{width:18px;height:18px;flex-shrink:0}
.sb-btn.add{background:var(--accent);color:#fff}
.sb-btn.add:active{background:var(--accent2)}
.sb-btn.util{background:var(--bg3);color:var(--text2)}
.sb-btn.util.on{outline:2px solid var(--accent);outline-offset:-2px;color:var(--accent)}
.swatches{flex:1;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0;scrollbar-width:none}
.swatches::-webkit-scrollbar{display:none}
.sw{width:128px;height:128px;border-radius:var(--r);border:3px solid transparent;overflow:hidden;cursor:pointer;position:relative;background:var(--bg3);flex-shrink:0}
.sw.active{border-color:var(--accent)}
.sw:active{transform:scale(0.97)}
.sw img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.sw .del{position:absolute;top:5px;right:5px;width:24px;height:24px;background:rgba(0,0,0,0.5);border-radius:var(--r);display:none;align-items:center;justify-content:center;font-size:14px;color:#fff;backdrop-filter:blur(4px)}
.sw.active .del{display:flex}

/* Trace toggle */
.trace-toggle{width:128px;height:40px;border-radius:var(--r);display:none;flex-shrink:0;overflow:hidden;border:1px solid var(--border)}
.trace-toggle.show{display:flex}
.trace-half{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:11px;font-weight:500;cursor:pointer;border:none;color:var(--text2);background:var(--bg3)}
.trace-half:first-child{border-right:1px solid var(--border)}
.trace-half.on{background:var(--accent);color:#fff}
.trace-half:active{opacity:0.8}

/* ── CONSTANT UI (top of sidebar2) ── */
.sidebar2{width:var(--sw2);min-width:var(--sw2);height:100%;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:0;z-index:9}
.sb2-title{font-family:var(--font);font-size:9px;font-weight:500;letter-spacing:0.5px;color:var(--text2);text-align:center;flex-shrink:0}
.brush-section{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:20px}
.brush-section .sb2-title{margin-bottom:2px}
.bz{border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--bg3);padding:0}
.bz.on{background:var(--accent)}
.bz.on .dt{background:#fff}
.bz:active{transform:scale(0.9)}
.bz.s{width:30px;height:30px}.bz.m{width:36px;height:36px}.bz.l{width:42px;height:42px}
.dt{border-radius:50%;background:var(--text2)}
.bz.s .dt{width:8px;height:8px}.bz.m .dt{width:14px;height:14px}.bz.l .dt{width:20px;height:20px}
.sb2-divider{width:100%;height:1px;background:var(--border);flex-shrink:0}

/* ── SECONDARY PANELS (below divider, contextual) ── */
.panel{display:none;flex-direction:column;align-items:center;gap:16px;padding-top:16px;width:100%}
.panel.show{display:flex}
.fn{display:flex;flex-direction:column;align-items:center;gap:6px}

/* Move button */
.move-btn{width:40px;height:40px;border-radius:var(--r);border:2px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.move-btn svg{width:20px;height:20px}
.move-btn.on{border-color:var(--accent);background:var(--accent);color:#fff}
.move-btn:active{transform:scale(0.93)}

/* Blend toggle */
.toggle-btn{width:40px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column}
.toggle-opt{flex:none;height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:10px;font-weight:500;cursor:pointer;border:none;color:var(--text2);background:var(--bg3)}
.toggle-opt:first-child{border-bottom:1px solid var(--border)}
.toggle-opt.on{background:var(--accent);color:#fff}
.toggle-opt:active{opacity:0.8}

/* +/- stepper buttons */
.stepper{display:flex;flex-direction:column;align-items:center;gap:4px}
.step-btn{width:40px;height:36px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:18px;font-weight:400;color:var(--text)}
.step-btn:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.step-label{font-family:var(--font);font-size:9px;font-weight:500;color:var(--text2);letter-spacing:0.5px}

/* ── MARKER COLOUR PALETTE ── */
.palette{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.pal-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.pal-dot.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg2)}
.pal-dot:active{transform:scale(0.85)}
.pal-picker{width:28px;height:28px;border-radius:50%;background:var(--accent);cursor:pointer;flex-shrink:0;border:2px solid transparent;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pal-picker.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg2)}
.pal-picker:active{transform:scale(0.85)}
.pal-picker svg{width:14px;height:14px;pointer-events:none}
.pal-picker input{position:absolute;width:200%;height:200%;opacity:0;cursor:pointer;top:-50%;left:-50%;border:none;padding:0}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{height:46px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.tg{display:flex;align-items:center;gap:6px}
.tb{height:34px;padding:0 12px;border:none;border-radius:var(--r);background:var(--bg3);color:var(--text2);font-family:var(--font);font-size:12px;font-weight:400;cursor:pointer;display:flex;align-items:center;gap:5px}
.tb:active{background:var(--border)}
.tb svg{width:16px;height:16px}
/* ── RULER OVERLAY ── */
.ruler{position:absolute;display:none;z-index:20;pointer-events:none}
.ruler.show{display:block}
.ruler-handle{width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.15);border:2px solid rgba(255,255,255,0.9);position:absolute;cursor:grab;pointer-events:auto;z-index:2}
.ruler-handle:active{cursor:grabbing;background:rgba(0,0,0,0.3)}
.ruler-bar{position:absolute;height:36px;background:rgba(255,255,255,0.55);border:1px solid rgba(0,0,0,0.12);border-radius:18px;pointer-events:auto;cursor:grab;transform-origin:0 50%;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 1px 6px rgba(0,0,0,0.08)}
.ruler-bar:active{cursor:grabbing}
.ruler-marks{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.ruler-readout{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:var(--font);font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;pointer-events:none;background:rgba(255,255,255,0.8);padding:2px 8px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.ruler-hint{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-family:var(--font);font-size:13px;font-weight:400;color:var(--text2);white-space:nowrap;pointer-events:none;background:rgba(255,255,255,0.8);padding:3px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);opacity:0;transition:opacity 0.6s ease}
.cw{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;background:var(--bg);position:relative}
canvas#c{background:var(--canvas-bg);border-radius:var(--r);box-shadow:0 2px 16px rgba(0,0,0,0.06);touch-action:none;cursor:crosshair}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:var(--bg);padding:8px 18px;border-radius:var(--r);font-family:var(--font);font-size:12px;font-weight:400;opacity:0;transition:transform 0.25s,opacity 0.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fh{display:none}
</style>
</head>
<body>
<div class="app">
  <!-- PRIMARY SIDEBAR -->
  <div class="sidebar">
    <button class="sb-btn add" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add</button>
    <div class="swatches" id="swatches"></div>
    <div class="trace-toggle" id="traceToggle">
      <button class="trace-half on" id="traceAbove">Above</button>
      <button class="trace-half" id="traceBelow">Below</button>
    </div>
    <button class="sb-btn util" id="gridBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="3" x2="21" y2="21"/><line x1="21" y1="3" x2="3" y2="21"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/></svg>Grid</button>
    <button class="sb-btn util" id="rulerBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="6" x2="6" y2="11"/><line x1="10" y1="6" x2="10" y2="14"/><line x1="14" y1="6" x2="14" y2="11"/><line x1="18" y1="6" x2="18" y2="14"/></svg>Ruler</button>
    <button class="sb-btn util" id="tplBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="21"/></svg>Trace</button>
    <button class="sb-btn util" id="eraserBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.2 2a2 2 0 0 1 2.8 0L21.8 6.8a2 2 0 0 1 0 2.8L11 20"/><path d="M6.5 13.5 11 18"/></svg>Eraser</button>
    <button class="sb-btn util" id="markerBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>Marker</button>
  </div>

  <!-- SIDEBAR 2 -->
  <div class="sidebar2">
    <div class="brush-section">
      <div class="sb2-title">Brush</div>
      <button class="bz s" data-s="10"><span class="dt"></span></button>
      <button class="bz m on" data-s="26"><span class="dt"></span></button>
      <button class="bz l" data-s="52"><span class="dt"></span></button>
    </div>
    <div class="sb2-divider"></div>

    <!-- SWATCH PANEL -->
    <div class="panel" id="swatchPanel">
      <div class="fn">
        <div class="sb2-title">Move</div>
        <button class="move-btn" id="moveBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 3-3 3"/><path d="M12 2l-3 3 3 3"/><path d="M2 12l3-3 3 3"/><path d="M2 12l3 3-3 3"/><path d="M22 12l-3-3-3 3"/><path d="M22 12l-3 3 3 3"/><path d="M12 22l3-3-3-3"/><path d="M12 22l-3-3 3-3"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg></button>
      </div>
      <div class="fn">
        <div class="sb2-title">Blend</div>
        <div class="toggle-btn">
          <button class="toggle-opt on" id="blendOn">On</button>
          <button class="toggle-opt" id="blendOff">Off</button>
        </div>
      </div>
      <div class="stepper">
        <div class="step-label">Bigger</div>
        <button class="step-btn" id="scaleUp">+</button>
        <button class="step-btn" id="scaleDown">−</button>
        <div class="step-label">Smaller</div>
      </div>
      <div class="stepper">
        <div class="step-label">Lighter</div>
        <button class="step-btn" id="brightUp">+</button>
        <button class="step-btn" id="brightDown">−</button>
        <div class="step-label">Darker</div>
      </div>
    </div>

    <!-- MARKER PANEL -->
    <div class="panel" id="markerPanel">
      <div class="sb2-title">Colour</div>
      <div class="palette" id="palette"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar">
      <div class="tg">
        <button class="tb" id="ubtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13C5.5 8.5 9.7 6 14.5 6c4.4 0 6.5 2.5 6.5 5.5S18.9 17 14.5 17H10"/></svg>Undo</button>
        <button class="tb" id="cbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"/></svg>Clear</button>
        <button class="tb" id="sbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Save</button>
      </div>
    </div>
    <div class="cw" id="cw">
      <canvas id="c"></canvas>
      <div class="ruler" id="ruler">
        <div class="ruler-handle ruler-h-a" id="rulerHA"></div>
        <div class="ruler-bar" id="rulerBar">
          <canvas class="ruler-marks" id="rulerMarks"></canvas>
          <div class="ruler-readout" id="rulerReadout">0"</div>
          <div class="ruler-hint" id="rulerHint">Drag each end to reposition</div>
        </div>
        <div class="ruler-handle ruler-h-b" id="rulerHB"></div>
      </div>
    </div>
  </div>
</div>
<input type="file" accept="image/*" class="fh" id="fi">
<input type="file" accept="image/*" class="fh" id="ti">
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';

// Marker colours — curated palette that fits the sidebar
const COLOURS=[
  '#2a2a2c','#8a8a8a','#d4d4d4','#ffffff',
  '#c0392b','#e8a0bf','#7c5cbf','#2980b9',
  '#1abc9c','#27ae60','#f39c12','#8d6e63'
];

const S={
  sw:[],act:null,
  er:false,mk:false,mkCol:'#2a2a2c',
  mv:false,br:26,st:[],
  tpl:null,tplAbove:false,
  blend:true,grid:false,ruler:false,
  mx:60
};
let sid=0;

const cv=document.getElementById('c'),x=cv.getContext('2d'),
  cw=document.getElementById('cw'),swEl=document.getElementById('swatches'),
  swatchPanel=document.getElementById('swatchPanel'),
  markerPanel=document.getElementById('markerPanel'),
  palEl=document.getElementById('palette'),
  fi=document.getElementById('fi'),ti=document.getElementById('ti'),
  te=document.getElementById('toast'),
  traceToggle=document.getElementById('traceToggle'),
  traceAbove=document.getElementById('traceAbove'),
  traceBelow=document.getElementById('traceBelow'),
  blendOn=document.getElementById('blendOn'),
  blendOff=document.getElementById('blendOff'),
  moveBtn=document.getElementById('moveBtn');
let W=0,H=0,D=1;

// ── BUILD PALETTE ──
// Custom colour picker at top
const pickerWrap=document.createElement('div');
pickerWrap.className='pal-picker';
pickerWrap.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>';
const pickerInput=document.createElement('input');
pickerInput.type='color';pickerInput.value='#e74c3c';
pickerWrap.appendChild(pickerInput);
palEl.appendChild(pickerWrap);
pickerInput.addEventListener('input',()=>{
  S.mkCol=pickerInput.value;
  pickerWrap.style.background=pickerInput.value;
  renderPalette();
});
pickerInput.addEventListener('change',()=>{
  S.mkCol=pickerInput.value;
  pickerWrap.style.background=pickerInput.value;
  renderPalette();
});

// Preset colours
COLOURS.forEach(c=>{
  const d=document.createElement('div');
  d.className='pal-dot';
  d.style.background=c;
  if(c==='#ffffff') d.style.border='2px solid var(--border)';
  d.dataset.c=c;
  d.addEventListener('click',()=>{S.mkCol=c;pickerWrap.style.background='';renderPalette()});
  palEl.appendChild(d);
});
function renderPalette(){
  const isPreset=COLOURS.includes(S.mkCol);
  pickerWrap.classList.toggle('on',!isPreset);
  if(!isPreset) pickerWrap.style.background=S.mkCol;
  else pickerWrap.style.background='';
  palEl.querySelectorAll('.pal-dot').forEach(d=>{
    d.classList.toggle('on',d.dataset.c===S.mkCol);
  });
}
renderPalette();

// ── RESIZE ──
// Canvas internal size locks after first stroke to preserve coordinates.
// On rotation/resize we only refit the CSS display size.
let canvasLocked=false, lockPxW=0, lockPxH=0;

function resize(){
  const p=20,mw=cw.clientWidth-p,mh=cw.clientHeight-p;
  D=Math.min(window.devicePixelRatio||1,2);

  if(!canvasLocked){
    // First sizing — set internal canvas dimensions
    const r=4/3;
    let w,h;if(mw/mh>r){h=mh;w=h*r}else{w=mw;h=w/r}
    W=Math.floor(w);H=Math.floor(h);
    lockPxW=Math.floor(W*D);lockPxH=Math.floor(H*D);
    cv.width=lockPxW;cv.height=lockPxH;
    cv.style.width=W+'px';cv.style.height=H+'px';
    x.setTransform(D,0,0,D,0,0);
    S.sw.forEach(s=>mkPat(s));replay();
  } else {
    // Locked — only refit CSS to viewport, keep internal size
    const ar=lockPxW/lockPxH;
    let fw,fh;
    if(mw/mh>ar){fh=mh;fw=fh*ar}else{fw=mw;fh=fw/ar}
    cv.style.width=Math.floor(fw)+'px';
    cv.style.height=Math.floor(fh)+'px';
    // W and H stay the same (CSS coords for drawing)
    // Rebuild patterns (they reference ctx)
    S.sw.forEach(s=>mkPat(s));replay();
  }
}

function lockCanvas(){
  if(!canvasLocked){canvasLocked=true}
}

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,200)});

// ── STROKE RENDERING ──
function rStrokeOn(c,st){
  if(st.sid==='e'){
    // Eraser: use white fill instead of destination-out to protect trace
    c.save();
    c.fillStyle='#ffffff';
    const b=st.b,p=st.p;if(!p.length){c.restore();return}
    c.beginPath();c.arc(p[0].x,p[0].y,b/2,0,Math.PI*2);c.fill();
    for(let i=1;i<p.length;i++){
      const a=p[i-1],e=p[i],d=Math.hypot(e.x-a.x,e.y-a.y),n=Math.max(1,(d/(b*.3))|0);
      for(let j=1;j<=n;j++){const t=j/n;c.beginPath();c.arc(a.x+(e.x-a.x)*t,a.y+(e.y-a.y)*t,b/2,0,Math.PI*2);c.fill()}
    }
    c.restore();return;
  }
  // Marker stroke
  if(st.sid.startsWith('mk:')){
    c.save();
    c.fillStyle=st.sid.slice(3);
    const b=st.b,p=st.p;if(!p.length){c.restore();return}
    c.beginPath();c.arc(p[0].x,p[0].y,b/2,0,Math.PI*2);c.fill();
    for(let i=1;i<p.length;i++){
      const a=p[i-1],e=p[i],d=Math.hypot(e.x-a.x,e.y-a.y),n=Math.max(1,(d/(b*.3))|0);
      for(let j=1;j<=n;j++){const t=j/n;c.beginPath();c.arc(a.x+(e.x-a.x)*t,a.y+(e.y-a.y)*t,b/2,0,Math.PI*2);c.fill()}
    }
    c.restore();return;
  }
  // Fabric stroke
  const sw=S.sw.find(s=>s.id===st.sid);
  c.save();
  if(sw&&sw.pat){c.fillStyle=sw.pat}else{c.restore();return}
  const b=st.b,p=st.p;if(!p.length){c.restore();return}
  c.beginPath();c.arc(p[0].x,p[0].y,b/2,0,Math.PI*2);c.fill();
  for(let i=1;i<p.length;i++){
    const a=p[i-1],e=p[i],d=Math.hypot(e.x-a.x,e.y-a.y),n=Math.max(1,(d/(b*.3))|0);
    for(let j=1;j<=n;j++){const t=j/n;c.beginPath();c.arc(a.x+(e.x-a.x)*t,a.y+(e.y-a.y)*t,b/2,0,Math.PI*2);c.fill()}
  }
  c.restore();
}
function rStroke(st){rStrokeOn(x,st)}

function drawTplOn(c){
  if(!S.tpl)return;
  const i=S.tpl.img,ar=i.width/i.height;
  let dw,dh;if(ar>W/H){dw=W;dh=W/ar}else{dh=H;dw=H*ar}
  c.save();c.globalAlpha=0.18;c.drawImage(i,(W-dw)/2,(H-dh)/2,dw,dh);c.restore();
}
function drawTpl(){drawTplOn(x)}

function drawGrid(c){
  if(!S.grid)return;
  const step=40;
  const step2=step*2;
  c.save();
  
  // Fine grid (1x) — horizontals and verticals
  c.strokeStyle='rgba(0,0,0,0.07)';
  c.lineWidth=0.5;
  for(let i=step;i<W;i+=step){c.beginPath();c.moveTo(i,0);c.lineTo(i,H);c.stroke()}
  for(let i=step;i<H;i+=step){c.beginPath();c.moveTo(0,i);c.lineTo(W,i);c.stroke()}
  
  // Fine diagonals — must pass through grid intersections
  // Lines going top-left to bottom-right (slope +1)
  for(let k=-(Math.ceil(H/step))*step; k<W+H; k+=step){
    c.beginPath();c.moveTo(k,0);c.lineTo(k+H,H);c.stroke();
  }
  // Lines going top-right to bottom-left (slope -1)
  for(let k=-Math.ceil(H/step)*step; k<W+H; k+=step){
    c.beginPath();c.moveTo(k,0);c.lineTo(k-H,H);c.stroke();
  }
  
  // Coarse grid (2x) — darker, same pattern
  c.strokeStyle='rgba(0,0,0,0.18)';
  c.lineWidth=0.75;
  for(let i=step2;i<W;i+=step2){c.beginPath();c.moveTo(i,0);c.lineTo(i,H);c.stroke()}
  for(let i=step2;i<H;i+=step2){c.beginPath();c.moveTo(0,i);c.lineTo(W,i);c.stroke()}
  for(let k=-(Math.ceil(H/step2))*step2; k<W+H; k+=step2){
    c.beginPath();c.moveTo(k,0);c.lineTo(k+H,H);c.stroke();
  }
  for(let k=-Math.ceil(H/step2)*step2; k<W+H; k+=step2){
    c.beginPath();c.moveTo(k,0);c.lineTo(k-H,H);c.stroke();
  }
  
  c.restore();
}

// ── CACHE FOR FAST REPLAY ──
let _cc=null,_cx=null,_cid=null;
function buildCache(skipId){
  if(!_cc){_cc=document.createElement('canvas');_cx=_cc.getContext('2d')}
  _cc.width=cv.width;_cc.height=cv.height;
  _cx.setTransform(D,0,0,D,0,0);
  if(!S.tplAbove) drawTplOn(_cx);
  for(let i=0;i<S.st.length;i++) if(S.st[i].sid!==skipId) rStrokeOn(_cx,S.st[i]);
  _cid=skipId;
}
function replayFast(id){
  if(_cid!==id) buildCache(id);
  x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,cv.width,cv.height);
  x.drawImage(_cc,0,0);x.restore();
  x.setTransform(D,0,0,D,0,0);
  for(let i=0;i<S.st.length;i++) if(S.st[i].sid===id) rStroke(S.st[i]);
  if(S.tplAbove) drawTpl();
  drawGrid(x);
}
function replay(){
  _cid=null;
  x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,cv.width,cv.height);x.restore();
  x.setTransform(D,0,0,D,0,0);
  if(!S.tplAbove) drawTpl();
  for(let i=0;i<S.st.length;i++) rStroke(S.st[i]);
  if(S.tplAbove) drawTpl();
  drawGrid(x);
}
let _raf=0;
function scheduleReplayFast(id){if(_raf)return;_raf=requestAnimationFrame(()=>{_raf=0;replayFast(id)})}

// ── DRAWING ──
let dr=false,cs=null,mvStart=null;
function gp(e){
  const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  // Map from CSS display coords to internal canvas coords
  const sx=W/r.width, sy=H/r.height;
  return{x:(t.clientX-r.left)*sx, y:(t.clientY-r.top)*sy};
}

function dn(e){
  e.preventDefault();const p=gp(e);
  if(S.mv&&S.act){dr=true;mvStart=p;return}
  dr=true;
  let id=null;
  if(S.er) id='e';
  else if(S.mk) id='mk:'+S.mkCol;
  else id=S.act;
  if(!id)return;
  cs={sid:id,b:S.br,p:[p]};
  // Live draw
  x.save();
  if(id==='e'){x.fillStyle='#ffffff'}
  else if(id.startsWith('mk:')){x.fillStyle=id.slice(3)}
  else{const sw=S.sw.find(s=>s.id===id);if(sw&&sw.pat)x.fillStyle=sw.pat;else{x.restore();return}}
  x.beginPath();x.arc(p.x,p.y,S.br/2,0,Math.PI*2);x.fill();x.restore();
}
function mmv(e){
  e.preventDefault();if(!dr)return;const p=gp(e);
  if(S.mv&&S.act&&mvStart){
    const sw=S.sw.find(s=>s.id===S.act);if(!sw)return;
    sw.ox+=(p.x-mvStart.x);sw.oy+=(p.y-mvStart.y);mvStart=p;
    mkPat(sw);scheduleReplayFast(sw.id);return;
  }
  if(!cs)return;
  const l=cs.p[cs.p.length-1];cs.p.push(p);const b=S.br;
  x.save();
  if(cs.sid==='e'){x.fillStyle='#ffffff'}
  else if(cs.sid.startsWith('mk:')){x.fillStyle=cs.sid.slice(3)}
  else{const sw=S.sw.find(s=>s.id===cs.sid);if(sw&&sw.pat)x.fillStyle=sw.pat;else{x.restore();return}}
  const d=Math.hypot(p.x-l.x,p.y-l.y),n=Math.max(1,(d/(b*.3))|0);
  for(let j=1;j<=n;j++){const t=j/n;x.beginPath();x.arc(l.x+(p.x-l.x)*t,l.y+(p.y-l.y)*t,b/2,0,Math.PI*2);x.fill()}
  x.restore();
}
function up(e){
  e.preventDefault();
  if(cs&&cs.p.length){
    S.st.push(cs);if(S.st.length>S.mx)S.st.shift();_cid=null;lockCanvas();
    // If marker stroke with a custom colour, add swatch to palette
    if(cs.sid.startsWith('mk:')){
      const col=cs.sid.slice(3);
      if(!COLOURS.includes(col)&&!palEl.querySelector('[data-c="'+col+'"]')){
        const d=document.createElement('div');
        d.className='pal-dot on';
        d.style.background=col;
        d.dataset.c=col;
        d.addEventListener('click',()=>{S.mkCol=col;pickerWrap.style.background='';renderPalette()});
        palEl.appendChild(d);
      }
    }
  }
  dr=false;cs=null;mvStart=null;
}

cv.addEventListener('touchend',up,{passive:false});

// ── PATTERNS ──
function mkPat(sw){
  const sz=Math.round(256*sw.sc);if(sz<4)return;
  const pc=document.createElement('canvas');pc.width=sz;pc.height=sz;
  const px=pc.getContext('2d');
  px.drawImage(sw.img,0,0,sz,sz);
  if(S.blend){
    const band=Math.max(2,Math.round(sz*0.08));
    px.save();
    for(let i=0;i<band;i++){const a=i/band;px.globalAlpha=a;px.drawImage(sw.img,0,0,(1/sz)*sw.img.width,sw.img.height,sz-band+i,0,1,sz)}
    for(let i=0;i<band;i++){const a=i/band;px.globalAlpha=a;px.drawImage(sw.img,0,0,sw.img.width,(1/sz)*sw.img.height,0,sz-band+i,sz,1)}
    px.restore();
  }
  if(sw.br!==0){
    px.globalCompositeOperation=sw.br>0?'lighter':'multiply';
    const v=Math.abs(sw.br)/100;
    if(sw.br>0)px.fillStyle=`rgba(255,255,255,${v})`;
    else{const c=Math.round(255*(1-v));px.fillStyle=`rgb(${c},${c},${c})`}
    px.fillRect(0,0,sz,sz);
  }
  sw.pat=x.createPattern(pc,'repeat');
  if(sw.ox||sw.oy) sw.pat.setTransform(new DOMMatrix().translateSelf(sw.ox,sw.oy));
}

// ── SWATCH MANAGEMENT ──
function addSw(src){
  const id='s'+(++sid),im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{
    const s=Math.min(im.width,im.height),ox=(im.width-s)/2,oy=(im.height-s)/2;
    const oc=document.createElement('canvas');oc.width=256;oc.height=256;
    oc.getContext('2d').drawImage(im,ox,oy,s,s,0,0,256,256);
    const sw={id,img:oc,th:oc.toDataURL('image/jpeg',0.75),pat:null,sc:1,br:0,ox:0,oy:0};
    mkPat(sw);S.sw.push(sw);sel(id);toast('Fabric added');
  };im.src=src;
}
function rmSw(id){
  S.sw=S.sw.filter(s=>s.id!==id);S.st=S.st.filter(s=>s.sid!==id);
  if(S.act===id)S.act=null;render();replay();toast('Removed');
}
function sel(id){S.act=id;S.er=false;S.mk=false;render()}

// ── RULER ──
const RULER_PX_PER_INCH=80; // 2x grid squares (40px * 2) = 1 inch (adjustable later)
const rulerEl=document.getElementById('ruler');
const rulerBar=document.getElementById('rulerBar');
const rulerHA=document.getElementById('rulerHA');
const rulerHB=document.getElementById('rulerHB');
const rulerMarks=document.getElementById('rulerMarks');
const rulerReadout=document.getElementById('rulerReadout');
const rulerHint=document.getElementById('rulerHint');
let rulerAx=100,rulerAy=200,rulerBx=400,rulerBy=200;
let rulerDrag=null,rulerDragOff={x:0,y:0};
let rulerHintShown=false,rulerHintTimer=null;

document.getElementById('rulerBtn').addEventListener('click',()=>{
  S.ruler=!S.ruler;
  rulerEl.classList.toggle('show',S.ruler);
  render();
  if(S.ruler){
    updateRuler();
    if(!rulerHintShown){
      rulerHintShown=true;
      rulerHint.style.opacity='1';
      rulerHintTimer=setTimeout(()=>{rulerHint.style.opacity='0'},5000);
    }
  } else {
    clearTimeout(rulerHintTimer);
  }
});

function updateRuler(){
  const dx=rulerBx-rulerAx, dy=rulerBy-rulerAy;
  const len=Math.hypot(dx,dy);
  const ang=Math.atan2(dy,dx);
  const cap=18; // radius of rounded end caps
  
  // Position handles at endpoints (concentric inside caps)
  rulerHA.style.left=(rulerAx-9)+'px';
  rulerHA.style.top=(rulerAy-9)+'px';
  rulerHB.style.left=(rulerBx-9)+'px';
  rulerHB.style.top=(rulerBy-9)+'px';
  
  // Bar extends cap distance beyond each endpoint
  const barLen=len+cap*2;
  const cosA=Math.cos(ang), sinA=Math.sin(ang);
  const barX=rulerAx-cosA*cap;
  const barY=rulerAy-sinA*cap;
  rulerBar.style.left=barX+'px';
  rulerBar.style.top=(barY-18)+'px';
  rulerBar.style.width=barLen+'px';
  rulerBar.style.transform='rotate('+ang+'rad)';
  
  // Tick marks — drawn with cap offset so 0" aligns with handle A
  const dpr=window.devicePixelRatio||1;
  rulerMarks.width=Math.max(1,Math.round(barLen*dpr));
  rulerMarks.height=Math.round(36*dpr);
  rulerMarks.style.width=Math.max(1,Math.round(barLen))+'px';
  rulerMarks.style.height='36px';
  const mx=rulerMarks.getContext('2d');
  mx.scale(dpr,dpr);
  const ppi=RULER_PX_PER_INCH;
  
  // Ticks start at cap offset (where straight section begins)
  for(let i=0;i<=len;i+=ppi/8){
    const xPos=i+cap;
    const isInch=Math.abs(i%ppi)<1;
    const isHalf=Math.abs(i%(ppi/2))<1;
    const isQuarter=Math.abs(i%(ppi/4))<1;
    let h;
    if(isInch){h=22;mx.lineWidth=1.5;mx.strokeStyle='rgba(0,0,0,0.55)'}
    else if(isHalf){h=15;mx.lineWidth=1;mx.strokeStyle='rgba(0,0,0,0.4)'}
    else if(isQuarter){h=10;mx.lineWidth=0.75;mx.strokeStyle='rgba(0,0,0,0.3)'}
    else{h=6;mx.lineWidth=0.5;mx.strokeStyle='rgba(0,0,0,0.2)'}
    mx.beginPath();mx.moveTo(Math.round(xPos)+0.5,0);mx.lineTo(Math.round(xPos)+0.5,h);mx.stroke();
    if(isInch){
      mx.font='500 11px "DM Sans",sans-serif';
      mx.fillStyle='rgba(0,0,0,0.5)';
      mx.textAlign='center';
      mx.fillText(Math.round(i/ppi),Math.round(xPos),33);
    }
  }
  
  // Readout
  const inches=len/ppi;
  rulerReadout.textContent=inches<1?(inches*8).toFixed(0)+'/8″':inches.toFixed(1)+'″';
}

// Ruler drag handling
let rulerOffA={x:0,y:0}, rulerOffB={x:0,y:0};

function rulerPos(e){
  const r=cw.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return{x:t.clientX-r.left, y:t.clientY-r.top};
}

function rulerPointerDown(e,mode){
  e.preventDefault();e.stopPropagation();
  const p=rulerPos(e);
  if(mode==='a'){
    rulerDrag='a';
    rulerOffA={x:p.x-rulerAx, y:p.y-rulerAy};
  } else if(mode==='b'){
    rulerDrag='b';
    rulerOffB={x:p.x-rulerBx, y:p.y-rulerBy};
  } else {
    rulerDrag='bar';
    rulerDragOff={x:p.x-rulerAx, y:p.y-rulerAy};
  }
}
function rulerPointerMove(e){
  if(!rulerDrag)return;
  e.preventDefault();e.stopPropagation();
  const p=rulerPos(e);
  if(rulerDrag==='a'){
    rulerAx=p.x-rulerOffA.x;rulerAy=p.y-rulerOffA.y;
  } else if(rulerDrag==='b'){
    rulerBx=p.x-rulerOffB.x;rulerBy=p.y-rulerOffB.y;
  } else {
    const dx=rulerBx-rulerAx, dy=rulerBy-rulerAy;
    rulerAx=p.x-rulerDragOff.x;rulerAy=p.y-rulerDragOff.y;
    rulerBx=rulerAx+dx;rulerBy=rulerAy+dy;
  }
  updateRuler();
}
function rulerPointerUp(){rulerDrag=null}

rulerHA.addEventListener('mousedown',e=>rulerPointerDown(e,'a'));
rulerHB.addEventListener('mousedown',e=>rulerPointerDown(e,'b'));

document.getElementById('sbtn').addEventListener('click',()=>{

  const ex=ec.getContext('2d');ex.fillStyle='#fff';ex.fillRect(0,0,ec.width,ec.height);ex.drawImage(cv,0,0);

    // Try Web Share API (iOS 15+)
    try{
      const f=new File([bl],'quiltpad.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        await navigator.share({files:[f],title:'QuiltPad'});
        toast('Shared');return;
      }
    }catch(e){if(e.name==='AbortError')return}
    // Try download link (desktop / some browsers)
    try{
      const a=document.createElement('a');
      if(typeof a.download==='string'){
        a.href=URL.createObjectURL(bl);a.download='quiltpad-'+Date.now()+'.png';
        a.click();URL.revokeObjectURL(a.href);toast('Saved');return;
      }
    }catch(e){}
    // Fallback: open in new tab (old iPads — long-press to save)
    const url=URL.createObjectURL(bl);
    window.open(url,'_blank');
    toast('Long-press image to save');
  },'image/png');
});

let tt;function toast(m){te.textContent=m;te.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>te.classList.remove('show'),2200)}

resize();render();
document.addEventListener('touchmove',e=>{if(e.target===cv||e.target.closest('.cw'))e.preventDefault()},{passive:false});
})();
</script>
