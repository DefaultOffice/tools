<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Board Downloader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Suisse Intl', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            padding: 24px;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            font-size: 13px;
            color: #666;
            text-decoration: none;
            transition: color 0.15s;
        }
        .back-link:hover { color: #1a1a1a; }

        .container { max-width: 520px; margin: 80px auto 0; }

        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.01em; }
        .subtitle { color: #666; margin-bottom: 32px; }

        label { display: block; font-size: 13px; margin-bottom: 6px; }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #1a1a1a; }
        input::placeholder { color: #aaa; }
        input:disabled { background: #fafafa; color: #888; }

        .button-row { display: flex; gap: 12px; margin-top: 16px; }

        button {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            background: #1a1a1a;
            color: #fff;
        }
        button:hover { background: #333; }
        button.secondary { background: #fff; color: #1a1a1a; flex: 0 0 auto; }
        button.secondary:hover { background: #f5f5f5; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        [hidden] { display: none !important; }

        .progress {
            margin-top: 24px;
            height: 2px;
            background: #eee;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0;
            background: #1a1a1a;
            transition: width 0.2s;
        }

        .board-name { margin-top: 24px; font-weight: 500; }
        .status { margin-top: 6px; font-size: 13px; color: #666; min-height: 20px; }
        .status.success { color: #22863a; }
        .status.error { color: #cb2431; }

        .notes {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #666;
        }
        .notes p + p { margin-top: 8px; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back</a>

    <div class="container">
        <h1>Pinterest Board Downloader</h1>
        <p class="subtitle">Paste a board link and get every image as a zip.</p>

        <label for="url">Pinterest board URL</label>
        <input type="text" id="url" placeholder="https://pin.it/… or https://pinterest.com/user/board" autocomplete="off" spellcheck="false">

        <div class="button-row">
            <button id="go-btn">Download board</button>
            <button id="cancel-btn" class="secondary" hidden>Cancel</button>
        </div>

        <div class="progress" id="progress" hidden><div class="progress-bar" id="progress-bar"></div></div>
        <p class="board-name" id="board-name" hidden></p>
        <p class="status" id="status"></p>

        <div class="notes">
            <p>Works with public boards, board sections and pin.it share links. Sections are saved as subfolders.</p>
            <p>Full-resolution originals are used where available. Videos download as their cover image.</p>
        </div>
    </div>

    <script>
        const API = '/api/pinterest';
        const CONCURRENCY = 6;
        const PART_LIMIT = 400 * 1024 * 1024; // split very large boards into several zips

        const $ = id => document.getElementById(id);
        const urlInput = $('url'), goBtn = $('go-btn'), cancelBtn = $('cancel-btn');
        let cancelled = false;
        let proxyOnly = false; // flips on if i.pinimg.com refuses direct browser fetches

        function setStatus(text, kind = '') {
            $('status').textContent = text;
            $('status').className = 'status' + (kind ? ' ' + kind : '');
        }
        function setProgress(frac) {
            $('progress').hidden = frac == null;
            $('progress-bar').style.width = Math.round((frac || 0) * 100) + '%';
        }
        function setBusy(busy) {
            urlInput.disabled = busy;
            goBtn.disabled = busy;
            cancelBtn.hidden = !busy;
        }

        async function api(params) {
            const res = await fetch(API + '?' + new URLSearchParams(params));
            let body = {};
            try { body = await res.json(); } catch {}
            if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
            return body;
        }

        async function collectPins(params, onPage) {
            const pins = [];
            let bookmark = null;
            do {
                if (cancelled) throw new Error('cancelled');
                const page = await api(bookmark ? { ...params, bookmark } : params);
                pins.push(...page.pins);
                onPage(pins.length);
                bookmark = page.bookmark;
            } while (bookmark);
            return pins;
        }

        async function collectSections(boardId) {
            const sections = [];
            let bookmark = null;
            do {
                const page = await api(bookmark ? { action: 'sections', boardId, bookmark } : { action: 'sections', boardId });
                sections.push(...page.sections);
                bookmark = page.bookmark;
            } while (bookmark);
            return sections;
        }

        async function fetchBlob(url) {
            if (!proxyOnly) {
                try {
                    const r = await fetch(url, { mode: 'cors', referrerPolicy: 'no-referrer' });
                    if (r.ok) return await r.blob();
                } catch { proxyOnly = true; }
            }
            const r = await fetch(API + '?' + new URLSearchParams({ action: 'image', url }));
            if (r.ok) return await r.blob();
            // Originals that are too large for the proxy fall back to the 736px version
            if (url.includes('/originals/')) {
                const smaller = url.replace('/originals/', '/736x/');
                const r2 = await fetch(API + '?' + new URLSearchParams({ action: 'image', url: smaller }));
                if (r2.ok) return await r2.blob();
            }
            throw new Error('image failed');
        }

        function safeName(s) {
            return String(s).replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 80) || 'board';
        }

        function extFrom(url, blob) {
            const m = url.split('?')[0].match(/\.(jpe?g|png|gif|webp)$/i);
            if (m) return m[1].toLowerCase().replace('jpeg', 'jpg');
            const t = (blob.type || '').split('/')[1];
            return t ? t.replace('jpeg', 'jpg') : 'jpg';
        }

        function saveZip(blob, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 60000);
        }

        async function run() {
            const url = urlInput.value.trim();
            if (!url) { setStatus('Paste a Pinterest board link first.', 'error'); return; }
            if (!/pinterest\.|pin\.it/i.test(url)) { setStatus('That doesn’t look like a Pinterest link.', 'error'); return; }

            cancelled = false;
            proxyOnly = false;
            setBusy(true);
            $('board-name').hidden = true;
            setProgress(0);
            setStatus('Looking up board…');

            try {
                const board = await api({ action: 'board', url });
                const title = board.section ? `${board.name} — ${board.section.title}` : board.name;
                $('board-name').textContent = title;
                $('board-name').hidden = false;

                // Build the list of { folder, pin } jobs
                const groups = [];
                const progressFind = n => setStatus(`Finding pins… ${n}`);
                if (board.section) {
                    groups.push({ folder: '', pins: await collectPins({ action: 'pins', boardId: board.id, sectionId: board.section.id }, progressFind) });
                } else {
                    let found = 0;
                    const main = await collectPins({ action: 'pins', boardId: board.id }, n => progressFind(found + n));
                    found += main.length;
                    groups.push({ folder: '', pins: main });
                    if (board.sectionCount) {
                        for (const s of await collectSections(board.id)) {
                            const pins = await collectPins({ action: 'pins', boardId: board.id, sectionId: s.id }, n => progressFind(found + n));
                            found += pins.length;
                            groups.push({ folder: safeName(s.title) + '/', pins });
                        }
                    }
                }

                const jobs = [];
                const seen = new Set();
                for (const g of groups) {
                    let i = 0;
                    for (const pin of g.pins) {
                        if (seen.has(g.folder + pin.id)) continue;
                        seen.add(g.folder + pin.id);
                        i++;
                        pin.images.forEach((src, n) => jobs.push({
                            src,
                            base: g.folder + String(i).padStart(4, '0') + '_' + pin.id + (pin.images.length > 1 ? '_' + (n + 1) : ''),
                        }));
                    }
                }
                if (!jobs.length) throw new Error('No images found on that board.');

                // Download with a small worker pool, splitting into parts if huge
                const rootName = safeName(board.section ? `${board.name} - ${board.section.title}` : board.name);
                let zip = new JSZip(), partBytes = 0, part = 1, done = 0, failed = 0, saved = 0;
                const parts = [];
                let next = 0;

                const flush = async (final) => {
                    if (!Object.keys(zip.files).length) return;
                    // Swap in a fresh zip synchronously so other workers keep adding to the next part
                    const current = zip, label = final && part === 1 ? '' : ` (part ${part})`;
                    zip = new JSZip(); partBytes = 0; part++;
                    parts.push(label);
                    setStatus(`Zipping${label}…`);
                    const blob = await current.generateAsync({ type: 'blob', compression: 'STORE' });
                    saveZip(blob, `${rootName}${label}.zip`);
                };

                async function worker() {
                    while (next < jobs.length && !cancelled) {
                        const job = jobs[next++];
                        try {
                            const blob = await fetchBlob(job.src);
                            zip.file(`${rootName}/${job.base}.${extFrom(job.src, blob)}`, blob);
                            partBytes += blob.size;
                            saved++;
                        } catch { failed++; }
                        done++;
                        setProgress(done / jobs.length);
                        setStatus(`Downloading ${done} / ${jobs.length}`);
                        if (partBytes > PART_LIMIT) await flush(false);
                    }
                }
                await Promise.all(Array.from({ length: CONCURRENCY }, worker));
                if (cancelled) throw new Error('cancelled');
                await flush(true);

                setProgress(1);
                const extra = failed ? ` · ${failed} couldn’t be downloaded` : '';
                const partNote = parts.length > 1 ? ` in ${parts.length} zips` : '';
                setStatus(`Done — ${saved} images saved${partNote}${extra}.`, failed ? '' : 'success');
            } catch (err) {
                setProgress(null);
                if (err.message === 'cancelled') setStatus('Cancelled.');
                else setStatus(err.message || 'Something went wrong.', 'error');
            } finally {
                setBusy(false);
            }
        }

        goBtn.addEventListener('click', run);
        cancelBtn.addEventListener('click', () => { cancelled = true; setStatus('Cancelling…'); });
        urlInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !goBtn.disabled) run(); });
    </script>
</body>
</html>
